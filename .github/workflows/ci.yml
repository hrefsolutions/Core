name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Href.Core.sln

      - name: Build (typecheck)
        run: dotnet build Href.Core.sln --no-restore -c Release

      - name: Test
        run: dotnet test Href.Core.sln --no-build -c Release
