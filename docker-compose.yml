services:
  postgres:
    image: postgres:16-alpine
    container_name: href-core-postgres
    environment:
      POSTGRES_DB: href_core
      POSTGRES_USER: href
      POSTGRES_PASSWORD: href
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U href -d href_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    container_name: href-core-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    profiles: [container]
    build: .
    image: href-core
    container_name: href-core-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=href_core;Username=href;Password=href
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
